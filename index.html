<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de turnos — Inyectoras</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f4f2; color: #1a1a1a; min-height: 100vh; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #111; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: #666; }
  .field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; color: #1a1a1a; outline: none; transition: border-color 0.15s; }
  .field input:focus, .field select:focus { border-color: #999; }
  .btn-primary { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; margin-top: 4px; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { background: transparent; border: 1px solid #ddd; border-radius: 8px; padding: 7px 14px; font-size: 12px; cursor: pointer; color: #444; transition: background 0.15s; }
  .btn-sm:hover { background: #f4f4f2; }
  .btn-del { background: transparent; border: none; color: #d9534f; font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px; line-height: 1; }
  .btn-del:hover { background: #fdf0f0; }
  .estado { display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; display: none; }
  .estado.enviando { background: #fffbeb; color: #92400e; display: flex; }
  .estado.ok       { background: #e6f7ee; color: #1a7a40; display: flex; }
  .estado.error     { background: #fdf0f0; color: #c0392b; display: flex; }
  .spinner { width: 14px; height: 14px; border: 2px solid #92400e44; border-top-color: #92400e; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: #f4f4f2; border-radius: 8px; padding: 12px 14px; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #111; }
  .stat-sub { font-size: 11px; color: #888; margin-top: 2px; }
  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: #888; padding: 6px 8px; border-bottom: 1px solid #eee; }
  td { padding: 9px 8px; border-bottom: 1px solid #f0f0f0; color: #1a1a1a; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .badge-1 { background: #dbeafe; color: #1e40af; }
  .badge-2 { background: #dcfce7; color: #166534; }
  .badge-3 { background: #fef9c3; color: #854d0e; }
  .empty { text-align: center; color: #aaa; font-size: 13px; padding: 32px 0; }
  @media (max-width: 500px) {
    table { font-size: 12px; }
    th, td { padding: 7px 5px; }
  }
</style>
</head>
<body>

<h1>Registro de turnos — Inyectoras</h1>

<div class="card">
  <p class="section-title">Registrar turno</p>

  <div id="estado" class="estado">
    <div id="estado-icono"></div>
    <span id="estado-msg"></span>
  </div>

  <div class="form-grid">
    <div class="field">
      <label>Legajo operario</label>
      <input type="text" id="legajo" placeholder="Ej: 1042" maxlength="10">
    </div>
    <div class="field">
      <label>Par de inyectoras</label>
      <select id="par">
        <option value="1">Iny 5 y 7</option>
        <option value="2">Iny 4 y 8</option>
        <option value="3">Iny 6 y 9</option>
      </select>
    </div>
    <div class="field">
      <label>Día</label>
      <input type="date" id="dia">
    </div>
  </div>
  <div class="form-grid">
    <div class="field">
      <label>Hora inicio</label>
      <input type="time" id="inicio">
    </div>
    <div class="field">
      <label>Hora fin</label>
      <input type="time" id="fin">
    </div>
  </div>
  <button class="btn-primary" id="btn-guardar" onclick="guardarTurno()">＋ Guardar turno</button>
</div>

<div class="stat-grid" id="stats-container"></div>

<div class="card">
  <div class="actions-row">
    <p class="section-title" style="margin:0">Turnos de esta sesión</p>
    <button class="btn-sm" onclick="limpiarTodo()">🗑 Limpiar</button>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Legajo</th>
          <th>Par</th>
          <th>Día</th>
          <th>Inicio</th>
          <th>Fin</th>
          <th>Hs reales</th>
          <th>Hs a pagar</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla-body">
        <tr><td colspan="8" class="empty">Todavía no hay turnos registrados.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwUe_KeJhxgWUtuLaqWBPGt42uhArlOaqRR5Kh2EAg6T4E0yWeJlixM9QOy2EoY4V3sQ/exec";

  let registros = [];
  const parNombres = { '1': 'Iny 5 y 7', '2': 'Iny 4 y 8', '3': 'Iny 6 y 9' };
  const parClases  = { '1': 'badge-1',   '2': 'badge-2',   '3': 'badge-3' };

  document.getElementById('dia').value = new Date().toISOString().split('T')[0];

  function setEstado(tipo, msg) {
    const el  = document.getElementById('estado');
    const ico = document.getElementById('estado-icono');
    const txt = document.getElementById('estado-msg');
    el.className = 'estado ' + tipo;
    txt.textContent = msg;
    if (tipo === 'enviando') {
      ico.innerHTML = '<div class="spinner"></div>';
    } else if (tipo === 'ok') {
      ico.innerHTML = '✓';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    } else {
      ico.innerHTML = '✕';
    }
  }

  function calcHorasAPagar(dia, inicio, fin) {
    const [anio, mes, diaNum] = dia.split('-').map(Number);
    const [hi, mi] = inicio.split(':').map(Number);
    const [hf, mf] = fin.split(':').map(Number);
    let minutosInicio = hi * 60 + mi;
    let minutosFin    = hf * 60 + mf;
    if (minutosFin <= minutosInicio) minutosFin += 24 * 60;
    const fechaInicio = new Date(anio, mes - 1, diaNum, hi, mi);
    let normales = 0, dobles = 0;
    for (let m = 0; m < (minutosFin - minutosInicio); m++) {
      const f  = new Date(fechaInicio.getTime() + m * 60000);
      const ds = f.getDay();
      const hm = f.getHours() * 60 + f.getMinutes();
      const esDoble = (ds === 6 && hm >= 13 * 60) || ds === 0 || (ds === 1 && hm < 6 * 60);
      if (esDoble) dobles++; else normales++;
    }
    return {
      reales: +((normales + dobles) / 60).toFixed(2),
      aPagar: +((normales / 60) + (dobles / 60) * 2).toFixed(2)
    };
  }

  async function guardarTurno() {
    const legajo = document.getElementById('legajo').value.trim();
    const par    = document.getElementById('par').value;
    const dia    = document.getElementById('dia').value;
    const inicio = document.getElementById('inicio').value;
    const fin    = document.getElementById('fin').value;

    if (!legajo || !dia || !inicio || !fin) {
      setEstado('error', 'Completá todos los campos antes de guardar.');
      return;
    }
    const calc = calcHorasAPagar(dia, inicio, fin);
    if (calc.reales <= 0) {
      setEstado('error', 'La hora de fin debe ser posterior a la de inicio.');
      return;
    }

    const registro = { id: Date.now(), legajo, par, dia, inicio, fin, reales: calc.reales, aPagar: calc.aPagar, enviado: false };
    registros.push(registro);
    renderTabla();
    renderStats();

    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    setEstado('enviando', 'Enviando a la planilla...');

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ registros: [{
          legajo, par: parNombres[par], dia, inicio, fin,
          horas: calc.reales.toFixed(2),
          horasAPagar: calc.aPagar.toFixed(2)
        }]})
      });
      registro.enviado = true;
      setEstado('ok', '✓ Turno guardado y enviado a la planilla correctamente.');
    } catch (err) {
      setEstado('error', 'No se pudo enviar a la planilla. El turno quedó guardado acá abajo.');
    }

    renderTabla();
    btn.disabled = false;

    document.getElementById('legajo').value = '';
    document.getElementById('inicio').value = '';
    document.getElementById('fin').value = '';
  }

  function eliminar(id) {
    registros = registros.filter(r => r.id !== id);
    renderTabla(); renderStats();
  }

  function limpiarTodo() {
    if (!registros.length) return;
    if (!confirm('¿Seguro que querés limpiar la lista?')) return;
    registros = [];
    renderTabla(); renderStats();
  }

  function renderTabla() {
    const tbody = document.getElementById('tabla-body');
    if (!registros.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">Todavía no hay turnos registrados.</td></tr>';
      return;
    }
    const sorted = [...registros].sort((a, b) => a.dia < b.dia ? 1 : -1);
    tbody.innerHTML = sorted.map(r => {
      const fecha  = new Date(r.dia + 'T12:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
      const doble  = r.aPagar > r.reales ? ' ⚡' : '';
      const estado = r.enviado
        ? '<span style="color:#1a7a40;font-size:12px;">✓ Enviado</span>'
        : '<span style="color:#92400e;font-size:12px;">⏳ Pendiente</span>';
      return `<tr>
        <td><strong>${r.legajo}</strong></td>
        <td><span class="badge ${parClases[r.par]}">${parNombres[r.par]}</span></td>
        <td>${fecha}</td>
        <td>${r.inicio}</td>
        <td>${r.fin}</td>
        <td>${r.reales} h</td>
        <td><strong>${r.aPagar} h${doble}</strong></td>
        <td>${estado}</td>
      </tr>`;
    }).join('');
  }

  function renderStats() {
    const c = document.getElementById('stats-container');
    if (!registros.length) { c.innerHTML = ''; return; }
    const totalReales = registros.reduce((s, r) => s + r.reales, 0);
    const totalPagar  = registros.reduce((s, r) => s + r.aPagar, 0);
    const legajos     = new Set(registros.map(r => r.legajo)).size;
    const porLeg      = {};
    registros.forEach(r => { porLeg[r.legajo] = (porLeg[r.legajo] || 0) + r.aPagar; });
    const top = Object.entries(porLeg).sort((a,b) => b[1]-a[1])[0];
    c.innerHTML = `
      <div class="stat"><div class="stat-label">Horas reales</div><div class="stat-value">${totalReales.toFixed(1)} h</div></div>
      <div class="stat"><div class="stat-label">Horas a pagar</div><div class="stat-value">${totalPagar.toFixed(1)} h</div></div>
      <div class="stat"><div class="stat-label">Operarios</div><div class="stat-value">${legajos}</div></div>
      <div class="stat"><div class="stat-label">Mayor carga</div><div class="stat-value">${top[1].toFixed(1)} h</div><div class="stat-sub">Legajo ${top[0]}</div></div>`;
  }
</script>
</body>
</html>
